<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cheers Mate</title>
    <style>
      body { width: 290px; padding: 18px; font: 14px system-ui; background: #10131b; color: #f4f5fa; }
      h1 { font-size: 20px; }
      button { padding: 12px; width: 100%; background: #5363ff; color: white; border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; }
      p { line-height: 1.5; color: #bfc6d9; }
      #status { color: #fff; }
    </style>
  </head>
  <body>
    <h1>Cheers Mate</h1>
    <p>Open Instagram's account suggestions. The controls appear directly on the page.</p>
    <button id="open">Open controls</button>
    <p>Delay: random 5–15 seconds.<br>Stop: click Stop or press Escape.</p>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
